defaults:
  - fjepa
  - override /data: tworoom
  - _self_

output_model_name: flow-jepa-tworoom-transition-rollout2

# One local transition-flow objective plus a composed two-step rollout loss.
# The local term flow-matches z_t -> z_{t+1}; the rollout term backprops
# through G(G(z_t, a_t), a_{t+1}) and compares with z_{t+2}.
num_preds: 2

flow_matching:
  source: noisy_current
  source_noise_scale: 0.25

model:
  objective: transition_flow_rollout2
  rollout_loss_weight: 1.0
  rollout_horizon: 2
  predictor:
    causal_self_attention: false
    dropout: 0.0

trainer:
  max_epochs: 20

